<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global Demonlist</title>
  <link rel="icon" href="/ne.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<button id="theme-toggle">Toggle Theme</button>

<div class="tabs">
  <img src="ne.png" class="tabs-logo">

  <button class="tab-btn active" data-tab="demonlist">Demonlist</button>
  <button class="tab-btn" data-tab="leaderboard">Leaderboard</button>
 <a
   class="tab-btn server-btn"
   href="https://discord.gg/qeTcKqMrYF"
   target="_blank"
   rel="noopener noreferrer"
 >
   Server
 </a>
<button class="tab-btn" data-tab="staff">Staff</button>
</div>

<div id="demonlist" class="tab-content active">
  <h1>Demonlist</h1>

  <div class="panel">
    <input id="search-bar" placeholder="Search demons by name or position">

    <div class="dropdown-row">
      <div class="dropdown-group">
        <label>Main List (1–75)</label>
        <select id="select-main"></select>
      </div>
      <div class="dropdown-group">
        <label>Extended List (76–100)</label>
        <select id="select-extended"></select>
      </div>
      <div class="dropdown-group">
        <label>Legacy List (101+)</label>
        <select id="select-legacy"></select>
      </div>
    </div>
  </div>

  <div class="subtabs">
    <button class="subtab-btn active" data-subtab="demons">Demons</button>
  </div>

  <div id="demons" class="subtab-content active">
    <div id="demon-container"></div>
  </div>
</div>


<div id="demon-page" class="tab-content">
  <div id="demon-page-container"></div>
</div>

<div id="leaderboard" class="tab-content">
  <h1>Leaderboard</h1>

  <div class="leaderboard-subtabs">
    <button class="leaderboard-subtab-btn active" data-lb="main-lb">Main</button>
  </div>

  <div id="main-lb" class="leaderboard-subtab-content active">
    <div class="panel">
      <div class="leaderboard-controls">
        <input id="player-search" placeholder="Search players">
        <select id="leaderboard-filter">
          <option value="points">Most Points</option>
          <option value="tier">Hardest</option>
        </select>
      </div>
      <div id="leaderboard-container"></div>
    </div>
  </div>
</div>


<div id="guidelines" class="tab-content">
  <h1>Extras</h1>
  <div class="panel">
     <a href="https://sites.google.com/view/dlplusstuff/home-page" target="_blank" class="submit-btn">Open Extras</a>
  </div>
</div>   

    
<div id="staff" class="tab-content">
  <h1>Staff Members</h1>
  <div class="panel staff-container">
    <div class="staff-card">
      <span class="staff-name">TheSilly</span>
      <span class="staff-role role-owner">Owner</span>
    </div>
    <div class="staff-card">
      <span class="staff-name">Gabri26120</span>
      <span class="staff-role role-suggestor">List Suggestor</span>
    </div>
    <div class="staff-card">
      <span class="staff-name">BelgioneAranci</span>
      <span class="staff-role role-suggestor">Mini List Suggestor</span>
    </div>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
